name: poweramp_clone
description: Local music player inspired by Poweramp.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  get_it: ^7.7.0
  equatable: ^2.0.5
  on_audio_query: ^2.9.0
  permission_handler: ^11.3.1
  just_audio: ^0.9.40
  audio_service: ^0.18.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
